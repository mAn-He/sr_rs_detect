# 모든 경로는 root에서 파생한다.
root: /workspace/rs-sr-detect
miniforge: /workspace/miniforge3
weights_dir: /workspace/weights
tmp_sr: /root/tmp_sr
tiles_cache: /root/tiles_cache

smoke: false
smoke_chips: 20
seed: 0

enable_resshift: true
enable_osediff: true
enable_adcsr: false

# 단계 → 환경 매핑 (docs/env_matrix.md)
envs:
  gdal: geo
  tiles: geo
  labels: geo
  sr_interp: geo
  sr_deep: sr
  sr_finetune: sr
  sr_osediff: osediff
  det_train: geo
  det_infer: geo
  merge: geo
  eval: geo
  sr_metrics: geo
  report: geo

# CPU 병렬 (Stage 0 측정: cgroup 13.6코어, RAM 62GB)
gdal_threads: 12
n_proc: 12

cache_dir: /workspace/cache

# 데이터 범위: train 칩 n_chips±50장을 담는 가장 조밀한 칩 격자 창
n_chips: 1200

# 격자 (CLAUDE.md G3, G4)
hr_res: 0.3
lr_res: 1.2
block_m: 576
split_ratio: [0.70, 0.15, 0.15]

# G1: MS/PS-RGB 축별 화소 크기 비율 허용 오차(4배 대비 상대 오차), LR로 쓸 MS 밴드(R, G, B 순, G1 상관 근거로 assert)
g1_ratio_tol: 0.02
ms_rgb_bands: [5, 3, 2]

# G5: 칩 footprint를 안쪽으로 줄이는 폭(m), 창 최소 크기(LR px), 블록 어긋남 상한(LR px)
g5_inset_m: 6.0
g5_min_window: 64
g5_max_shift: 0.5

# G6: 8비트 변환 백분위
pct: [2, 98]
