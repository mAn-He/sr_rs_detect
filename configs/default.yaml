# 모든 경로는 root에서 파생한다.
root: /workspace/rs-sr-detect
miniforge: /workspace/miniforge3
weights_dir: /workspace/weights
tmp_sr: /root/tmp_sr
tiles_cache: /root/tiles_cache

smoke: false
smoke_chips: 20
seed: 0

enable_resshift: true
enable_osediff: true
enable_adcsr: false

# 단계 → 환경 매핑 (docs/env_matrix.md). 모든 단계 스크립트는 gdal 환경에서 돌고,
# 공식 SR 스크립트(SwinIR·Real-ESRGAN·ResShift, S6 학습)는 official_sr, OSEDiff는 official_osediff 환경의 python으로 실행한다.
envs:
  gdal: geo
  official_sr: sr
  official_osediff: osediff

# CPU 병렬 (Stage 0 측정: cgroup 13.6코어, RAM 62GB)
gdal_threads: 12
n_proc: 12

cache_dir: /workspace/cache

# 데이터 범위: train 칩 n_chips±50장을 담는 가장 조밀한 칩 격자 창
n_chips: 1200

# 격자 (CLAUDE.md G3, G4)
hr_res: 0.3
lr_res: 1.2
block_m: 576
split_ratio: [0.70, 0.15, 0.15]

# G1: MS/PS-RGB 축별 화소 크기 비율 허용 오차(4배 대비 상대 오차), LR로 쓸 MS 밴드(R, G, B 순, G1 상관 근거로 assert)
g1_ratio_tol: 0.02
ms_rgb_bands: [5, 3, 2]

# G5: 칩 footprint를 안쪽으로 줄이는 폭(m), 창 최소 크기(LR px), 블록 어긋남 상한(LR px)
g5_inset_m: 6.0
g5_min_window: 64
g5_max_shift: 0.5

# G6: 8비트 변환 백분위
pct: [2, 98]

# G9 타일 (LR px): 창 256, 블록 안 시작점 0과 224(겹침 32). train·val 타일은 유효 비율 이상만(M7)
tile_lr: 256
tile_starts_lr: [0, 224]
min_valid_frac: 0.25

# G10 라벨: 타일 창으로 자른 면적이 원래 면적의 이 비율 미만이면 제외
label_min_frac: 0.5

# 탐지기 (Ultralytics 공식 OBB, 작성 시점 YOLO26-OBB s)
yolo_weights: yolo26s-obb.pt
imgsz_hr: 1024
imgsz_lr: 256
epochs: 100          # Ultralytics 공식 기본값. smoke는 smoke_epochs
smoke_epochs: 1
patience: 20
# D_LR 수렴 민감도(사전 고정 기준): 같은 설정에 epochs만 d_lr_sens_epochs로 학습한 D_LR_e<epochs>의 LR val 지리 AP50이
# D_LR보다 d_lr_sens_min_gain 이상 높으면 D_HR·D_LR을 그 에폭으로 재학습한다(geo_eval.py val이 판정).
d_lr_sens_epochs: 200
d_lr_sens_min_gain: 0.01
batch: 0.80          # 공식 AutoBatch: GPU 메모리 80%
workers: 8
# 학습 val·추론 max_det = max(max_det_min, max_det_factor × train·val 타일당 GT 최대 개수)(labels.py → label_stats.json).
# 1000에서 HR val 101타일 중 33타일이 상한에 걸려 3000으로 올렸다(decisions.md '평가 세부 정의').
max_det_factor: 3
max_det_min: 3000
det_cache: disk     # Ultralytics cache='disk'(디코딩한 .npy를 tiles_cache에 저장, 학습 후 삭제)
deterministic: true # Ultralytics 공식 옵션(기본값 true), seed와 함께 고정
# AP용 예측은 Ultralytics val 기본 conf 0.001. 운영 conf와 타일 병합 NMS IoU는 val 블록에서만 정한다(geo_eval.py val):
# 병합 IoU는 D_HR·HR val에서 후보를 비교해 고르고(AP50 차가 iou_ap50_tie 이내면 중복 쌍 비율이 낮은 쪽, 아니면 AP50 높은 쪽),
# 운영 conf는 D_HR(HR val)·D_LR(LR val) 각각 F1 최대 conf(Ultralytics ap_per_class와 같은 계산). 결과는 results/det_calibration.json.
det_conf_ap: 0.001
nms_iou_candidates: [0.5, 0.7]
iou_ap50_tie: 0.005
dup_iou: 0.3        # 중복 쌍: 병합 후 운영 conf 이상 예측끼리 회전 IoU > dup_iou

# S6 Real-ESRGAN paired 파인튜닝: 공식 yml(total_iter 400k, milestones [400k])에서 출발.
# 본 실행 데이터로 s6_measure_iter 반복을 돌려 반복당 시간을 재고, total_iter = s6_budget_h × s6_budget_use 안에 끝나는 반복 수,
# milestones는 400k 대비 같은 비율로 줄인다. 체크포인트는 마지막(net_g_latest.pth)을 쓴다.
s6_budget_h: 3
s6_budget_use: 0.9
s6_measure_iter: 300
s6_smoke_iter: 20

# 평가 (M4, M5, G12)
eval_buffer_lr: 8
eval_buffer_sens: [0, 8, 16]
eval_outside_frac: 0.5
match_iou: 0.5
area_bins: [50, 150, 400]
bootstrap: 1000
smoke_bootstrap: 50

# OpenCV 엣지 지표: Canny 임계값 = HR train 타일 밝기 중앙값 × 비율(한 번 정해 모든 방법에 같은 값)
canny_ratio: [0.66, 1.33]

# SR 방법 ID → 범주 (CLAUDE.md 'SR 방법'). S5는 enable_resshift, S7은 enable_osediff일 때만 실행한다.
sr_methods:
  S0_gdal_cubic: interpolation
  S1_gdal_lanczos: interpolation
  S2_swinir_classical_x4: regression
  S3_realesrnet_x4plus: regression
  S4_realesrgan_x4plus: gan
  S5_resshift_v3_x4: diffusion_efficient
  S6_realesrgan_ft_spacenet: domain_finetune
  S7_osediff_x4: diffusion_1step
